<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leilighetsprotokoll</title><style>
:root{color-scheme:light dark;--bg:#f2f5f8;--card:#fff;--text:#172b3c;--border:#c8d2dc;--accent:#176178} @media(prefers-color-scheme:dark){:root{--bg:#101b24;--card:#1b2b38;--text:#eef5fa;--border:#4b6272;--accent:#70cde5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}header,main{max-width:1000px;margin:auto;padding:16px}h1{font-size:25px;margin:0}nav,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px}button{cursor:pointer;min-height:44px}button.active{background:var(--accent);color:var(--bg)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent)}input,select,textarea{width:100%}textarea{min-height:90px}label{display:block;font-size:14px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}.card,details{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0}summary{cursor:pointer;font-weight:650}.muted{font-size:14px;opacity:.8}.bad{border-left:5px solid #d36a49}.photos{display:flex;flex-wrap:wrap;gap:12px}.photos img{width:120px;height:100px;object-fit:cover;border-radius:8px}.photos figure{margin:0}.photos button{display:block;font-size:12px}.stats{font-size:18px}#notice{min-height:24px}dialog{max-width:95%;border-radius:12px;background:var(--card);color:var(--text)}dialog img{max-width:100%;max-height:70vh}a{color:var(--accent)}.warn{padding:12px;border:1px solid #c68428;border-radius:8px}.status{font-size:14px} @media print{header,nav,.actions,.noprint{display:none!important}body{background:white;color:black}.card{break-inside:avoid}}
</style></head><body><header><h1>Leilighetsprotokoll</h1><p class="muted">Overtakelse, nye mangler og oppfølging. Privat arbeidslogg, ikke erstatning for utbyggers signerte protokoll.</p><div id="notice" role="status" aria-live="polite">Laster lokal lagring …</div><nav id="nav"></nav></header><main id="main"></main><input id="import" type="file" accept="application/json,.json" hidden><dialog id="viewer"><img alt="Dokumentasjonsbilde"><div class="actions"><button id="close">Lukk</button></div></dialog><script>
const D=[
["Formalia og overtakelse","K:Brukstillatelse eller ferdigattest foreligger","K:Garanti fra utbygger (§ 12) er stilt","K:Ingen mangler som hindrer bruk (strøm, vann, varme)","K:Gjenstående/utsatte arbeider med frist i protokollen","V:Kontaktperson for reklamasjon notert","V:Skriftlig innkalling mottatt (minst 7 dager før)"],
["Adkomst og fellesareal","V:Dør til oppgang, nøkler og brikker virker","V:Dørtelefon/ringeklokke virker","V:Rømningsveier og branndører i trapperom","B:Postkasse merket, nøkkel passer","B:Trapperom og gang ferdig, rent, lys virker"],
["Inngangsdør og entré","K:Nøkler: riktig antall, alle låser virker","V:Dør går lett og tetter jevnt","V:Branndør er merket og lukker selv"],
["Gulv, vegger, tak og dører","V:Gulv: helning, svikt, knirk, hule fliser","V:Gulv: riper, skader og skjøter (sidelys)","V:Vegger: maling, sparkling, sprekker","V:Tak: flekker, sprekker, downlights","V:Innerdører åpner/lukker uten å subbe","B:Lister og gerikter tette og pene","B:Rent og uten byggerester"],
["Vinduer og terrassedør","K:Soverom: vindu kan åpnes helt (rømning)","K:Terskel ved terrassedør er tett mot vann","V:Alle vinduer åpner, lukker og låser","V:Trekk eller lys-spalter rundt vinduer/dører","V:Glass uten riper, dugg mellom glass","V:Terrassedør går lett, tetter og låser"],
["Kjøkken","K:Vannlås og rør under vask er tette","V:Skap og skuffer går jevnt, uten skader","V:Benkeplate og silikon uten skader","V:Vask og batteri: trykk, varmt/kaldt, drypp","V:Kjøkkenvifte suger, lys virker","V:Stikkontakter og belysning virker","V:Komfyrvakt montert og testet"],
["Hvitevarer og inventar","K:Hvitevarer levert som avtalt (merke/modell)","K:Oppvaskmaskin: kort program uten lekkasje","V:Kjøleskap/fryser kjøler og lukker tett","V:Komfyr/platetopp: alle soner varmer","V:Stekeovn varmer, lys og dør ok","V:Vaskemaskin/tørketrommel (hvis følger med)","V:Garderobeskap/innredning festet og justert","V:Bruksanvisninger og garantibevis levert","B:Riper på hvitevarer, plast fjernet","B:Speil, persienner, solskjerming (hvis inkl.)"],
["Bad og våtrom","K:Våtromsdokumentasjon foreligger","K:Fall mot sluk (klinkekule/vann)","K:Sluk rent, klemring, renner raskt","K:Silikon og fuger tette, uten sprekker","K:Dusj 5–10 min: ingen lekkasje utenfor","V:Fliser: bank etter hule partier","V:Servant og skap tette og faste","V:Toalett fast, spyler, ingen lekkasje","V:Avtrekk suger (papirtest)","V:Gulvvarme og håndkletørker virker","V:Lys og stikk montert riktig","V:Inspeksjonsluke ved skjulte rør","B:Speil, kroker og tilbehør montert"],
["Elektro, varme og tele","K:Jordfeilbryter: testknapp (gjør sist)","K:Alle stikkontakter testet (stikkontakttester)","V:Sikringsskap merket og tilgjengelig","V:Brytere, dimmere og lamper virker","V:Varme: termostater i alle rom virker","V:Målere: nummer og målerstand fotografert","B:Internett/TV-uttak virker","B:Stikk- og bryterdekk montert rett"],
["VVS (vann og avløp)","K:Hovedstoppekran funnet og testet","K:Lekkasjesjekk: vask, toalett, bereder, skap","V:Vannfordelerskap ryddig, stoppekraner virker","V:Vanntrykk med flere tappesteder samtidig","V:Varmtvann blir varmt og stabilt","V:Bereder: plassering, lekkasje, størrelse","V:Avløp: ingen lukt, renner jevnt","B:Rør-i-rør: smukker/endeplugger montert","B:Lekkasjesikring (hvis installert)"],
["Ventilasjon og innemiljø","K:Fukt: flekker, blæret maling, yttervegger","V:Tilluft og avtrekk virker i alle rom","V:Innreguleringsprotokoll mottatt","V:Lyd fra ventilasjon og tekniske anlegg","V:Filtre: plassering og bytterutine","V:Lukt (mugg, kjemikalier) og kondens","V:Kalde partier i gulv/yttervegg (1. etasje)","V:Radon: tiltak dokumentert (mål 2+ mnd)","V:Lydforhold: naboer, trapperom, vei"],
["Brann og sikkerhet","K:Røykvarslere virker (testknapp)","V:Brannslokker/brannteppe montert","V:Rømningsvei fri, dører åpner innenfra","V:Innbruddssikring 1. etasje: låser"],
["Markterrasse og uteområde","K:Status: ferdig eller utsatt? (skriftlig)","K:Utsatt arbeid: beskrivelse, frist, ansvar","K:Fall og avrenning bort fra fasaden","K:Overgang dør–terrasse tett, ikke stående vann","V:Avgrensning og størrelse mot tegning","V:Dekke jevnt og stabilt, uten skader","V:Fasade/sokkel uten fukt, kledning fri fra bakken","V:Sluk, kummer, nedløp: rene, vannet går vekk","V:Rekkverk, gjerde og port","V:Utebelysning og utekontakt (jordfeil)","V:Vinterforhold: bilder + ny befaring i vår","B:Skjerming/innsyn og beplantning","B:Utekran (frostsikker), lokk i dekket","B:Avrenning fra balkong/tak over"],
["Bod","V:Riktig bod: nummer og størrelse mot kontrakt","V:Lås og nøkkel virker","V:Fukt/mugg i gulv, vegger og tak","V:Ventilasjon/luft i boden","B:Lys, stikk, hyller (hvis avtalt)","B:Adkomst og dørbredde"],
["Mål og kontrakt","K:Planløsning stemmer med tegning","K:Tilvalg og endringer levert som bestilt","V:Mål noen rom mot tegning","V:Materialer/farger iht. leveransebeskrivelse","V:Antall og plassering av uttak mot el-tegning"],
["Avslutning og protokoll","K:Alle avvik står i overtakelsesprotokollen","K:Frist og ansvarlig på hvert avvik","K:Protokoll lest, signert, kopi mottatt","V:Nøkler og brikker kvittert","V:Tilbakehold vurdert (megler/rådgiver)","V:Dokumentasjon (FDV m.m.) mottatt/bestilt","V:Ettårsbefaring og reklamasjon avtalt"]
];

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString(),day=()=>new Date().toLocaleDateString('sv-SE');
const items=[];D.forEach((s,i)=>s.slice(1).forEach((t,j)=>items.push({id:i+'.'+j,sec:i,p:t[0],title:t.slice(2)})));
let state={schema:2,meta:{},checks:{},issues:[],updated:now()},tab='overview',db,client,user,revision=null,cloudReady=false,busy=false,autoTimer,saveQueue=Promise.resolve(),generation=0,filter='Alle';
const tabs={overview:'Oversikt',meta:'Bolig / overtakelse',check:'Sjekkliste',issues:'Avvik',export:'Rapport / backup',cloud:'Innlogging / sky'};
function notice(t){$('#notice').textContent=t}
function put(k,v){return new Promise((resolve,reject)=>{const tx=db.transaction('k','readwrite');tx.objectStore('k').put(v,k);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function get(k){return new Promise((resolve,reject)=>{const q=db.transaction('k').objectStore('k').get(k);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function save(){generation++;state.updated=now();const snapshot=structuredClone(state);saveQueue=saveQueue.catch(()=>{}).then(()=>put('protocol-v2',snapshot));saveQueue.then(()=>notice('Lagret på denne enheten: '+new Date(snapshot.updated).toLocaleString('nb-NO'))).catch(e=>notice('LAGRING FEILET: '+e.message+'. Eksporter backup straks.'));if(cloudReady){clearTimeout(autoTimer);autoTimer=setTimeout(()=>pushCloud(),5000)}return saveQueue}
const fields={project:'Prosjekt',developer:'Utbygger',address:'Adresse',apartment:'Leilighetsnummer',buyer:'Kjøper',date:'Overtakelsesdato',representative:'Representant for utbygger',contact:'Kontaktperson / entreprenør',email:'Utbyggers e-post',meter:'Målernummer og målerstand',keys:'Antall nøkler og brikker',annual:'Ettårsbefaring',general:'Generelle merknader'};
function input(label,value,attrs='',type='text'){return `<label>${esc(label)}<input type="${type}" value="${esc(value)}" ${attrs}></label>`}
function select(label,value,values,attrs){return `<label>${esc(label)}<select ${attrs}>${values.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function photos(issue){return `<div class="photos">${(issue.photos||[]).map((p,i)=>`<figure><img src="${esc(p.data)}" alt="${esc(p.kind)} ${i+1}" data-view="${issue.id}:${i}"><figcaption class="muted">${esc(p.kind)} · ${esc(p.date?.slice(0,10))}</figcaption><button data-delphoto="${issue.id}:${i}">Slett bilde</button></figure>`).join('')}</div><label>Legg til dokumentasjon<input type="file" accept="image/*" multiple data-photo="${issue.id}"></label><label>Bilde etter utbedring<input type="file" accept="image/*" multiple data-after="${issue.id}"></label>`}
function issueCard(x){return `<article class="card bad" data-issue="${x.id}"><h3>${esc(x.number)} · ${esc(x.room)} · ${esc(x.title)}</h3><p class="muted">Registrert ${new Date(x.created).toLocaleString('nb-NO')} · sist endret ${new Date(x.updated).toLocaleString('nb-NO')}</p><div class="grid">${input('Rom / område',x.room,'data-field="room"')}${input('Tittel',x.title,'data-field="title"')}${select('Status',x.status,['Åpent','Akseptert','Utbedret','Avvist'],'data-field="status"')}${select('Alvorlighet',x.severity,['Kritisk','Viktig','Mindre'],'data-field="severity"')}${input('Ansvarlig',x.owner,'data-field="owner"')}${input('Avtalt frist',x.deadline,'data-field="deadline"','date')}</div><label>Beskrivelse<textarea data-field="description">${esc(x.description)}</textarea></label><label>Ønsket tiltak<textarea data-field="action">${esc(x.action)}</textarea></label><label>Kommentar fra utbygger (registreres manuelt)<textarea data-field="response">${esc(x.response)}</textarea></label>${photos(x)}<button data-delete="${x.id}">Slett avvik</button></article>`}
function addIssue(item){const n=Math.max(0,...state.issues.map(x=>Number(x.number.slice(3))||0))+1;const x={id:uid(),number:'AV-'+String(n).padStart(3,'0'),checkId:item?.id||null,room:item?D[item.sec][0]:'',title:item?.title||'Nytt avvik',description:'',action:'',response:'',owner:'',deadline:'',severity:item?.p==='K'?'Kritisk':'Viktig',status:'Åpent',created:now(),updated:now(),photos:[]};state.issues.push(x);if(item)state.checks[item.id]={...(state.checks[item.id]||{}),status:'av'};save();tab='issues';filter='Alle';render();return x}
function render(){ const expanded=[...document.querySelectorAll('#main details')].map(x=>x.open);$('#nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('');let h='';const c=Object.values(state.checks),open=state.issues.filter(x=>x.status!=='Utbedret');
if(tab==='overview')h=`<section class="card"><h2>${esc(state.meta.address||'Din leilighet')}</h2><p class="stats">${c.filter(x=>x.status==='ok').length} OK · ${state.issues.length} avvik · ${open.length} ikke utbedret</p><p>${items.length-c.filter(x=>x.status).length} sjekkpunkter gjenstår.</p><div class="actions"><button data-tab="check">Start / fortsett sjekkliste</button><button data-new>Nytt avvik</button></div></section><p class="warn">Lokal lagring er ikke en sikkerhetskopi. Eksporter backup med bilder, eller sett opp skylagring. Eksisterende lokale data er ikke automatisk flyttet til en ny nettadresse.</p><p>Rapporten er din dokumentasjon. Sørg også for at avtalte mangler, frister og ansvar kommer med i utbyggers protokoll.</p>`;
if(tab==='meta')h=`<section class="card"><h2>Bolig og overtakelse</h2><div class="grid">${Object.entries(fields).map(([k,l])=>input(l,state.meta[k],`data-meta="${k}"`,['date','annual'].includes(k)?'date':k==='email'?'email':'text')).join('')}</div></section>`;
if(tab==='check')h=`<p class="muted">Originale sjekkpunkter er beholdt. Prioritet er veiledende, ikke en verifisert juridisk eller teknisk vurdering. Notater lagres automatisk.</p>`+D.map((s,i)=>`<details><summary>${esc(s[0])}</summary>${items.filter(x=>x.sec===i).map(x=>{const v=state.checks[x.id]||{};return `<div class="card"><b>${esc(x.title)}</b><p class="muted">${{K:'Kritisk',V:'Viktig',B:'Bør'}[x.p]}</p><div class="actions">${[['ok','OK'],['av','Avvik'],['na','Ikke aktuelt'],['','Gjenstår']].map(([k,l])=>`<button data-check="${x.id}" data-status="${k}" class="${v.status===k?'active':''}">${l}</button>`).join('')}</div><label>Notat<textarea data-note="${x.id}">${esc(v.note)}</textarea></label><button data-issuefor="${x.id}">Åpne / opprett avvik med bilder</button></div>`}).join('')}</details>`).join('');
if(tab==='issues')h=`<div class="actions"><button data-new>＋ Nytt avvik</button></div>${select('Vis status',filter,['Alle','Åpent','Akseptert','Utbedret','Avvist'],'id="filter"')}`+state.issues.filter(x=>filter==='Alle'||x.status===filter).map(issueCard).join('')+(state.issues.length?'':'<p>Ingen avvik registrert.</p>');
if(tab==='export')h=`<section class="card"><h2>Rapport til utbygger</h2><p>Åpner en utskriftsvennlig rapport med bilder. Velg «Lagre som PDF» i nettleserens utskriftsdialog. Ingen ekstern PDF-tjeneste brukes.</p><div class="actions"><button data-report="all">Full protokoll</button><button data-report="open">Kun ikke-utbedrede avvik</button><button data-mail>Åpne e-postutkast</button></div><p class="muted">PDF må vedlegges manuelt. Appen sender ikke e-post og utbygger får ikke tilgang til databasen.</p></section><section class="card"><h2>Sikkerhetskopi</h2><div class="actions"><button data-backup>Eksporter JSON med alle bilder</button><button data-import>Importer backup</button><button data-images>Last ned alle bilder</button><button data-restore>Gjenopprett forrige lokale versjon</button></div><p>Import og nedlasting fra sky tar automatisk vare på forrige lokale versjon. Backupfilen inneholder private opplysninger. Oppbevar den sikkert.</p><button data-reset>Nullstill protokoll lokalt</button></section>`;
if(tab==='cloud'){let cfg={};try{cfg=JSON.parse(localStorage.getItem('protocol-config')||'{}')}catch{}h=`<section class="card"><h2>Skylagring</h2><p>Opprett Supabase-prosjekt og kjør vedlagte SQL-fil først. Bruk bare publishable / anon key, aldri secret eller service_role.</p>${input('Supabase prosjekt-URL',cfg.url,'id="cloud-url"','url')}${input('Publishable / anon key',cfg.key,'id="cloud-key"')}<button data-connect>Lagre innstillinger / koble til</button>${input('Din e-post',user?.email||'','id="login-email"','email')}<div class="actions"><button data-login>Send innloggingslenke</button><button data-logout>Logg ut</button></div><p>${user?'Innlogget: '+esc(user.email):'Ikke innlogget'}</p><div class="actions"><button data-push>Last opp / synkroniser lokal protokoll</button><button data-pull>Hent protokoll fra sky</button></div><p class="warn">Én protokoll per bruker. Første gang på ny enhet: hent fra sky før du redigerer. Automatisk opplasting aktiveres etter vellykket henting eller opplasting. Samtidige endringer på flere enheter stoppes med konfliktmelding, de flettes ikke automatisk.</p><p>Lokal kopi blir liggende etter utlogging. På delt enhet: eksporter backup og nullstill lokalt etter utlogging.</p></section>`}$('#main').innerHTML=h;if(tab==='check')document.querySelectorAll('#main details').forEach((x,i)=>x.open=!!expanded[i]);}
function download(name,content,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function validate(x){if(!x||x.schema!==2||!x.meta||!x.checks||!Array.isArray(x.issues)||x.issues.length>5000)throw Error('Ugyldig backupformat');for(const a of x.issues){if(typeof a.id!=='string'||! /^[a-zA-Z0-9-]+$/.test(a.id)||typeof a.number!=='string'||!Array.isArray(a.photos))throw Error('Ugyldig avvik');for(const p of a.photos)if(typeof p.id!=='string'||! /^[a-zA-Z0-9-]+$/.test(p.id)||typeof p.data!=='string'||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.data))throw Error('Ugyldig bilde')}return x}
async function replaceState(x){validate(x);await saveQueue.catch(()=>{});await put('previous-v2',state);state=x;await save();render()}
async function compress(f){if(f.size>30*1024*1024)throw Error('Bildet er større enn 30 MB');const u=URL.createObjectURL(f);try{const im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=()=>j(Error('Bildeformatet kan ikke leses. Bruk JPEG/PNG.'));im.src=u});const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)}finally{URL.revokeObjectURL(u)}}
function report(mode){const w=window.open('','_blank');if(!w){notice('Tillat popup-vinduer for rapporten.');return}const list=state.issues.filter(x=>mode!=='open'||x.status!=='Utbedret');const html=`<!doctype html><html lang="nb"><head><meta charset="utf-8"><title>Leilighetsprotokoll</title><style>body{font:14px/1.5 Arial;color:#111;max-width:850px;margin:24px auto;padding:16px}h1{font-size:26px}article{border-top:1px solid #bbb;margin-top:24px;padding-top:12px}img{max-width:100%;max-height:340px}figure{display:inline-block;max-width:46%;margin:8px}p{white-space:pre-wrap}li{margin:8px 0}@media print{button{display:none}figure{break-inside:avoid}h2,h3{break-after:avoid}}@page{size:A4;margin:18mm}</style></head><body><button onclick="window.print()">Skriv ut / lagre som PDF</button><h1>${mode==='open'?'Åpne avvik':'Leilighetsprotokoll'}</h1><p>Generert ${new Date().toLocaleString('nb-NO')} · ${list.length} avvik i rapporten</p>${Object.entries(fields).map(([k,l])=>state.meta[k]?`<p><b>${esc(l)}:</b> ${esc(state.meta[k])}</p>`:'').join('')}<p>Privat dokumentasjon. Signaturfelt nedenfor innebærer ikke at rapporten er signert.</p>${list.map(x=>`<article><h2>${esc(x.number)} · ${esc(x.room)}</h2><h3>${esc(x.title)}</h3><p>Status: ${esc(x.status)} · Alvorlighet: ${esc(x.severity)}<br>Registrert: ${esc(x.created)}<br>Ansvarlig: ${esc(x.owner||'Ikke avtalt')} · Frist: ${esc(x.deadline||'Ikke avtalt')}</p><p><b>Beskrivelse:</b> ${esc(x.description)}</p><p><b>Ønsket tiltak:</b> ${esc(x.action)}</p><p><b>Kommentar fra utbygger (manuelt registrert):</b> ${esc(x.response)}</p>${x.photos.map((p,i)=>`<figure><img src="${esc(p.data)}" alt="Dokumentasjon"><figcaption>${esc(x.number)} · ${esc(p.kind)} ${i+1} · ${esc(p.date)}</figcaption></figure>`).join('')}</article>`).join('')}${mode==='all'?'<h2>Sjekkliste</h2>'+D.map((s,i)=>`<h3>${esc(s[0])}</h3><ul>${items.filter(x=>x.sec===i).map(x=>`<li><b>${esc(({ok:'OK',av:'Avvik',na:'Ikke aktuelt'})[state.checks[x.id]?.status]||'Gjenstår')}</b> · ${esc(x.title)}${state.checks[x.id]?.note?'<p>'+esc(state.checks[x.id].note)+'</p>':''}</li>`).join('')}</ul>`).join(''):''}<h2>Signaturer</h2><p>Kjøper: _____________________ Dato: __________</p><p>Utbygger: ___________________ Dato: __________</p></body></html>`;w.document.open();w.document.write(html);w.document.close()}
async function connect(){let cfg;try{cfg=JSON.parse(localStorage.getItem('protocol-config')||'{}')}catch{return}if(!cfg.url||!cfg.key)return;const url=new URL(cfg.url);if(url.protocol!=='https:'||!url.hostname.endsWith('.supabase.co'))throw Error('Bruk prosjektets https://….supabase.co URL');if(cfg.key.startsWith('sb_secret_'))throw Error('Secret key må ikke brukes i nettleseren');if(!window.supabase){await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=r;s.onerror=()=>j(Error('Kunne ikke laste skylagringsbibliotek. Lokal lagring virker fortsatt.'));document.head.append(s)})}client=window.supabase.createClient(cfg.url,cfg.key);const {data,error}=await client.auth.getSession();if(error)throw error;user=data.session?.user;client.auth.onAuthStateChange((event,session)=>{const changed=user?.id!==session?.user?.id;user=session?.user;if(changed||event==='SIGNED_OUT'){cloudReady=false;revision=null;clearTimeout(autoTimer)}if(tab==='cloud')render()});notice(user?'Innlogget. Hent eller last opp protokoll for å starte synkronisering.':'Sky tilkoblet. Logg inn.');render()}
function requireUser(){if(!client||!user)throw Error('Koble til og logg inn først');if(!navigator.onLine)throw Error('Ingen internettforbindelse. Data lagres lokalt.')}
async function pushCloud(){if(busy)return;busy=true;clearTimeout(autoTimer);const start=generation;try{requireUser();await saveQueue;const snapshot=structuredClone(state);const {data:existing,error:readError}=await client.from('apartment_protocols').select('revision').eq('user_id',user.id).maybeSingle();if(readError)throw readError;if(existing&&revision===null)throw Error('Det finnes allerede en protokoll i skyen. Eksporter lokal backup og hent skyversjonen først.');if(existing&&existing.revision!==revision)throw Error('Konflikt: skyversjonen er endret på en annen enhet. Eksporter lokal backup før du henter skyversjonen.');for(const x of snapshot.issues)for(const p of x.photos){p.path=p.path||`${user.id}/${p.id}.jpg`;const blob=await (await fetch(p.data)).blob();const {error}=await client.storage.from('protocol-photos').upload(p.path,blob,{contentType:'image/jpeg',upsert:true});if(error)throw error;delete p.data}const next=(revision||0)+1;let result;if(existing)result=await client.from('apartment_protocols').update({payload:snapshot,revision:next,updated_at:now()}).eq('user_id',user.id).eq('revision',revision).select('revision');else result=await client.from('apartment_protocols').insert({user_id:user.id,payload:snapshot,revision:next}).select('revision');if(result.error)throw result.error;if(!result.data?.length)throw Error('Konflikt under lagring. Hent skyversjonen etter lokal backup.');revision=next;cloudReady=true;notice('Synkronisert til sky: '+new Date().toLocaleString('nb-NO'));if(generation!==start)autoTimer=setTimeout(()=>pushCloud(),5000)}catch(e){cloudReady=false;notice('Sky: '+e.message+' Lokal kopi beholdes.')}finally{busy=false}}
async function pullCloud(){requireUser();if(busy)return;if(!confirm('Erstatte lokal protokoll med skyversjonen? Forrige lokale versjon lagres som gjenopprettingskopi. Eksporter gjerne backup først.'))return;busy=true;cloudReady=false;clearTimeout(autoTimer);const initialGeneration=generation;try{const {data,error}=await client.from('apartment_protocols').select('*').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!data)throw Error('Ingen protokoll i skyen. Last opp lokal protokoll først.');const x=data.payload;for(const a of x.issues)for(const p of a.photos){const {data:blob,error}=await client.storage.from('protocol-photos').download(p.path);if(error)throw error;p.data=await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(blob)})}if(generation!==initialGeneration)throw Error('Lokale endringer under nedlasting. Prøv igjen uten å redigere.');await replaceState(x);revision=data.revision;cloudReady=true;notice('Skyversjon hentet. Automatisk synkronisering aktiv.')}finally{busy=false}}
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};
$('#main').addEventListener('input',e=>{const t=e.target;if(t.dataset.meta){state.meta[t.dataset.meta]=t.value;save()}if(t.dataset.note){const k=t.dataset.note;state.checks[k]={...(state.checks[k]||{}),note:t.value};save()}if(t.dataset.field){const x=state.issues.find(x=>x.id===t.closest('[data-issue]').dataset.issue);x[t.dataset.field]=t.value;x.updated=now();save()}});
$('#main').addEventListener('change',async e=>{try{const t=e.target;if(t.id==='filter'){filter=t.value;render()}const id=t.dataset.photo||t.dataset.after;if(id){const x=state.issues.find(x=>x.id===id);for(const f of t.files){x.photos.push({id:uid(),data:await compress(f),kind:t.dataset.after?'Etter utbedring':'Registrering',date:now()})}x.updated=now();await save();render()}}catch(e){notice(e.message)}});
$('#main').onclick=async e=>{const b=e.target.closest('button,[data-view]');if(!b)return;const d=b.dataset;try{if(d.tab){tab=d.tab;render()}if('new'in d)addIssue();if(d.check){const x=items.find(x=>x.id===d.check);state.checks[x.id]={...(state.checks[x.id]||{}),status:d.status};if(d.status==='av'&&!state.issues.some(a=>a.checkId===x.id))addIssue(x);else{save();render()}}if(d.issuefor){const x=state.issues.find(x=>x.checkId===d.issuefor);if(!x)addIssue(items.find(x=>x.id===d.issuefor));else{tab='issues';filter='Alle';render();document.querySelector(`[data-issue="${x.id}"]`).scrollIntoView()}}if(d.delete&&confirm('Slette avvik og bilder lokalt? Eksporter backup først.')){const x=state.issues.find(x=>x.id===d.delete);if(x.checkId&&state.checks[x.checkId]?.status==='av')state.checks[x.checkId].status='';state.issues=state.issues.filter(x=>x.id!==d.delete);save();render()}if(d.view){const [id,i]=d.view.split(':');$('#viewer img').src=state.issues.find(x=>x.id===id).photos[+i].data;$('#viewer').showModal()}if(d.delphoto&&confirm('Slette bildet?')){const [id,i]=d.delphoto.split(':');state.issues.find(x=>x.id===id).photos.splice(+i,1);save();render()}if(d.report)report(d.report);if('backup'in d){await saveQueue;download('leilighetsprotokoll-backup-'+day()+'.json',JSON.stringify(state,null,2),'application/json')}if('import'in d)$('#import').click();if('images'in d){const ps=state.issues.flatMap(x=>x.photos.map((p,i)=>({x,p,i})));if(!ps.length)throw Error('Ingen bilder å laste ned');notice('Nettleseren kan be om tillatelse til flere nedlastinger.');for(const {x,p,i}of ps){const a=document.createElement('a');a.href=p.data;a.download=x.number+'-'+p.kind.replaceAll(' ','-')+'-'+(i+1)+'.jpg';a.click();await new Promise(r=>setTimeout(r,250))}}if('restore'in d){const x=await get('previous-v2');if(!x)throw Error('Ingen gjenopprettingskopi');if(confirm('Gjenopprette forrige lokale versjon?')){cloudReady=false;await replaceState(x)}}if('reset'in d&&confirm('Nullstille alle lokale data? Skyversjonen slettes ikke. Eksporter backup først.')){cloudReady=false;clearTimeout(autoTimer);await replaceState({schema:2,meta:{},checks:{},issues:[],updated:now()})}if('mail'in d){const email=state.meta.email||'';if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Kontroller utbyggers e-postadresse');const body='Hei,\n\nVedlagt følger dokumentasjon av registrerte avvik for '+(state.meta.address||'leiligheten')+'.\n\n'+state.issues.filter(x=>x.status!=='Utbedret').map(x=>x.number+' – '+x.room+': '+x.title).join('\n')+'\n\nVennligst bekreft mottak og gi tilbakemelding om tiltak og tidspunkt for utbedring.\n\nMed vennlig hilsen\n'+(state.meta.buyer||'');location.href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent('Avvik – '+(state.meta.address||'leilighet'))+'&body='+encodeURIComponent(body);notice('Vedlegg PDF manuelt før sending.')}if('connect'in d){localStorage.setItem('protocol-config',JSON.stringify({url:$('#cloud-url').value.trim(),key:$('#cloud-key').value.trim()}));await connect()}if('login'in d){if(!client)throw Error('Koble til først');const email=$('#login-email').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Oppgi gyldig e-post');if(location.protocol==='file:')throw Error('Innlogging krever publisert nettside eller localhost');const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;notice('Innloggingslenke sendt. Åpne på samme enhet.')}if('logout'in d){cloudReady=false;clearTimeout(autoTimer);if(client){const {error}=await client.auth.signOut();if(error)throw error}user=null;revision=null;render()}if('push'in d)await pushCloud();if('pull'in d)await pullCloud()}catch(e){notice(e.message)}};
$('#close').onclick=()=>$('#viewer').close();$('#import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>250*1024*1024)throw Error('Backupfilen er for stor');const x=validate(JSON.parse(await f.text()));if(confirm('Erstatte lokal protokoll med denne backupen?')){cloudReady=false;clearTimeout(autoTimer);await replaceState(x)}}catch(e){notice('Import: '+e.message)}finally{e.target.value=''}};
window.addEventListener('online',()=>{if(cloudReady)pushCloud();else notice('Internett tilgjengelig. Synkroniser fra Sky-fanen.')});
(async()=>{try{db=await new Promise((r,j)=>{const q=indexedDB.open('ovt',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});const saved=await get('protocol-v2');if(saved)state=validate(saved);else{const old=await get('s');if(old){for(const i of items){const v=old[i.id];if(v){state.checks[i.id]={status:v.s||'',note:v.n||''};const ps=await get('p'+i.id)||[];if(v.s==='av'||ps.length){const x=addIssue(i);x.description=v.n||'';x.photos=ps.map(data=>({id:uid(),data,kind:'Importert fra utkast',date:now()}));if(v.s!=='av')state.checks[i.id].status=v.s||''}}}await save()}}render();notice('Lokal protokoll klar. '+(saved?'Tidligere data hentet.':'Data lagres automatisk.'));try{await connect()}catch(e){notice(e.message)}}catch(e){notice('Lokal lagring kunne ikke åpnes: '+e.message+'. Ikke registrer før lagring virker.');$('#main').innerHTML='<p>Lagring utilgjengelig. Prøv vanlig nettleservindu og tillat nettstedsdata.</p>'}})();
</script></body></html>
